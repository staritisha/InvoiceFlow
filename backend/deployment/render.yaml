services:
  # ─────────────────────────────────────────────
  # FastAPI Web Service
  # ─────────────────────────────────────────────
  - type: web
    name: invoiceflow-api
    runtime: python
    region: oregon
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: pip install -r app/requirements/prod.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: invoiceflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: invoiceflow-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: OPENAI_API_KEY
        sync: false # Set manually in Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: noreply@invoiceflow.ai
      - key: ALLOWED_ORIGINS
        sync: false # Set to your frontend URL
      - key: SENTRY_DSN
        sync: false

  # ─────────────────────────────────────────────
  # Celery Background Worker
  # ─────────────────────────────────────────────
  - type: worker
    name: invoiceflow-worker
    runtime: python
    region: oregon
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: pip install -r app/requirements/prod.txt
    startCommand: celery -A app.celery_app worker --loglevel=info --concurrency=2
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoiceflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: invoiceflow-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

# ─────────────────────────────────────────────
# PostgreSQL Database
# ─────────────────────────────────────────────
databases:
  - name: invoiceflow-db
    region: oregon
    plan: starter
    databaseName: invoiceflow
    user: invoiceflow

  # ─────────────────────────────────────────────
  # Redis Cache
  # ─────────────────────────────────────────────
  - type: redis
    name: invoiceflow-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
