user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─────────────────────────────────────────
    # Logging
    # ─────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ─────────────────────────────────────────
    # Performance
    # ─────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    # ─────────────────────────────────────────
    # Gzip Compression
    # ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ─────────────────────────────────────────
    # Rate Limiting Zones
    # ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m  rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─────────────────────────────────────────
    # Upstream: FastAPI app
    # ─────────────────────────────────────────
    upstream invoiceflow_api {
        server api:8000;
        keepalive 32;
    }

    # ─────────────────────────────────────────
    # HTTP → HTTPS redirect (enable for prod)
    # ─────────────────────────────────────────
    # server {
    #     listen 80;
    #     server_name yourdomain.com www.yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }

    # ─────────────────────────────────────────
    # Main Server Block
    # ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Max upload size (for logos, reports)
        client_max_body_size 20M;

        # Security headers
        add_header X-Frame-Options           "SAMEORIGIN"              always;
        add_header X-Content-Type-Options    "nosniff"                 always;
        add_header X-XSS-Protection          "1; mode=block"           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        # ── Static files ──────────────────────
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Auth endpoints (strict rate limit) ──
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://invoiceflow_api;
            include /etc/nginx/proxy_params.conf;
        }

        # ── AI endpoints (moderate rate limit) ──
        location /api/ai/ {
            limit_req zone=ai_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://invoiceflow_api;
            include /etc/nginx/proxy_params.conf;
        }

        # ── WebSocket connections ─────────────
        location /ws/ {
            proxy_pass http://invoiceflow_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            limit_conn conn_limit 5;
        }

        # ── All other API routes ──────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://invoiceflow_api;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Health check (no rate limit) ──────
        location /health {
            proxy_pass http://invoiceflow_api;
            access_log off;
        }

        # ── Catch-all → FastAPI ──────────────
        location / {
            proxy_pass http://invoiceflow_api;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Custom error pages ────────────────
        error_page 429 /429.json;
        location = /429.json {
            return 429 '{"detail":"Too many requests. Please slow down.","code":"RATE_LIMITED"}';
            add_header Content-Type application/json;
        }

        error_page 502 503 504 /50x.json;
        location = /50x.json {
            return 502 '{"detail":"Service temporarily unavailable.","code":"SERVICE_ERROR"}';
            add_header Content-Type application/json;
        }
    }

    # ─────────────────────────────────────────
    # HTTPS server (uncomment for SSL)
    # ─────────────────────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #
    #     # ... same location blocks as above ...
    # }
}